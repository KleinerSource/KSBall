name: Build KSBall

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TrollStore TIPA
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build Release app
        env:
          DERIVED_DATA: ${{ runner.temp }}/KSBallDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project KSBall.xcodeproj \
            -scheme KSBall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Install ldid-procursus
        run: |
          set -euo pipefail
          brew install ldid-procursus
          command -v ldid

      - name: Package TrollStore TIPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/KSBallDerivedData
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA/Build/Products/Release-iphoneos/KSBall.app"
          test -d "$app_path"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          executable_path="$app_path/$executable_name"
          test -f "$executable_path"
          entitlements_path="$GITHUB_WORKSPACE/KSBall/KSBall.entitlements"
          test -f "$entitlements_path"
          mkdir -p artifact/Payload
          echo "Signing $executable_name with ldid-procursus"
          ldid -M -S"$entitlements_path" "$app_path"
          echo 'Exporting signed entitlements'
          ldid -e "$executable_path" > artifact/KSBall.entitlements.plist
          plutil -lint artifact/KSBall.entitlements.plist
          assert_true_entitlement() {
            local key="$1"
            local value
            if ! value="$(/usr/libexec/PlistBuddy -c "Print :$key" artifact/KSBall.entitlements.plist)"; then
              echo "::error title=Missing entitlement::$key was not exported by ldid"
              return 1
            fi
            echo "$key=$value"
            case "$value" in
              true|1) ;;
              *)
                echo "::error title=Invalid entitlement::$key must be true, got $value"
                return 1
                ;;
            esac
          }
          assert_true_entitlement 'platform-application'
          assert_true_entitlement 'com.apple.QuartzCore.displayable-context'
          assert_true_entitlement 'com.apple.QuartzCore.secure-mode'
          assert_true_entitlement 'com.apple.springboard.accessibility-window-hosting'
          assert_true_entitlement 'user-preference-read'
          assert_true_entitlement 'user-preference-write'
          assert_true_entitlement 'com.apple.private.persona-mgmt'
          assert_true_entitlement 'com.apple.private.security.no-sandbox'
          signed_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' artifact/KSBall.entitlements.plist)"
          if [[ "$signed_app_identifier" != 'com.kleinersource.ksball' ]]; then
            echo "::error title=Invalid application identifier::Expected com.kleinersource.ksball, got $signed_app_identifier"
            exit 1
          fi
          cp -R "$app_path" artifact/Payload/KSBall.app
          ditto -c -k --sequesterRsrc --keepParent artifact/Payload artifact/KSBall.tipa
          shasum -a 256 artifact/KSBall.tipa | tee artifact/KSBall.tipa.sha256

      - name: Upload TIPA and build log
        uses: actions/upload-artifact@v7
        with:
          name: KSBall-${{ github.sha }}
          path: |
            artifact/KSBall.tipa
            artifact/KSBall.tipa.sha256
            artifact/KSBall.entitlements.plist
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Update testing release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download TIPA
        uses: actions/download-artifact@v8
        with:
          name: KSBall-${{ github.sha }}
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: testing
        run: |
          set -euo pipefail
          find release -type f -print
          tipa_path="$(find release -type f -name 'KSBall.tipa' -print -quit)"
          checksum_path="$(find release -type f -name 'KSBall.tipa.sha256' -print -quit)"
          build_log_path="$(find release -type f -name 'xcodebuild.log' -print -quit)"
          test -n "$tipa_path"
          test -n "$checksum_path"
          test -n "$build_log_path"
          release_notes="自动测试构建

          提交：${GITHUB_SHA}
          分支：${GITHUB_REF_NAME}
          工作流：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset_name; do
              gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release edit "$RELEASE_TAG" \
              --title 'KSBall 测试构建' \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$release_notes"
            gh release upload "$RELEASE_TAG" \
              "$tipa_path" \
              "$checksum_path" \
              "$build_log_path" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$tipa_path" \
              "$checksum_path" \
              "$build_log_path" \
              --title 'KSBall 测试构建' \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$release_notes"
          fi
