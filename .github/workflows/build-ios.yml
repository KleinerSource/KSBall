name: Build KSBall

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TrollStore TIPA
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # 版本号按上一次 CI 版本递增之后的全部提交计算，需要完整历史。
          fetch-depth: 0

      - name: Test version policy
        run: python3 -m unittest discover -s Scripts -v

      # 新增/删除/增强功能：次版本号 +1 且补丁号归零；优化/修复/改进：补丁号 +1；
      # 构建、CI、文档、测试与编译修复只增加 build；build 每次构建都 +1。
      # 这里只改工作区里的 Info.plist，main/dev 分支构建成功后才由 release job 写回仓库。
      - name: Compute build version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 Scripts/bump_version.py --auto)"
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            /usr/libexec/PlistBuddy -c 'Set :KSBallUpdateChannel dev' KSBall/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'KSBall dev'" KSBall/Info.plist
          else
            /usr/libexec/PlistBuddy -c 'Set :KSBallUpdateChannel latest' KSBall/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName KSBall" KSBall/Info.plist
          fi
          echo "构建版本：${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # 资源目录引用的 AppIcon.png 缺失时 Xcode 不会报错，只会静默产出没有图标的应用。
      - name: Generate app icon if missing
        run: |
          set -euo pipefail
          icon_path="KSBall/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [[ ! -f "$icon_path" ]]; then
            python3 Scripts/generate_app_icon.py
          fi
          test -f "$icon_path"

      - name: Build Release app
        env:
          DERIVED_DATA: ${{ runner.temp }}/KSBallDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project KSBall.xcodeproj \
            -scheme KSBall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Install ldid-procursus
        run: |
          set -euo pipefail
          brew install ldid-procursus
          command -v ldid

      - name: Package TrollStore TIPA
        id: package
        env:
          DERIVED_DATA: ${{ runner.temp }}/KSBallDerivedData
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA/Build/Products/Release-iphoneos/KSBall.app"
          test -d "$app_path"
          built_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")+$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          if [[ "$built_version" != "$VERSION" ]]; then
            echo "::error title=Version mismatch::Built app reports $built_version, expected $VERSION"
            exit 1
          fi
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          executable_path="$app_path/$executable_name"
          test -f "$executable_path"
          # 确认资源目录编译出了主屏图标：Info.plist 登记了 CFBundleIcons，且 Assets.car 与图标文件都在包内。
          if ! icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app_path/Info.plist")"; then
            echo "::error title=Missing app icon::CFBundleIcons was not generated into Info.plist"
            exit 1
          fi
          test -f "$app_path/Assets.car" || { echo "::error title=Missing app icon::Assets.car was not produced"; exit 1; }
          ls "$app_path"/AppIcon*.png >/dev/null 2>&1 || { echo "::error title=Missing app icon::No AppIcon*.png in the app bundle"; exit 1; }
          echo "App icon: $icon_name"; ls "$app_path"/AppIcon*.png
          entitlements_path="$GITHUB_WORKSPACE/KSBall/KSBall.entitlements"
          test -f "$entitlements_path"
          mkdir -p artifact/Payload
          echo "Signing $executable_name with ldid-procursus"
          ldid -M -S"$entitlements_path" "$app_path"
          echo 'Exporting signed entitlements'
          ldid -e "$executable_path" > artifact/KSBall.entitlements.plist
          plutil -lint artifact/KSBall.entitlements.plist
          assert_true_entitlement() {
            local key="$1"
            local value
            if ! value="$(/usr/libexec/PlistBuddy -c "Print :$key" artifact/KSBall.entitlements.plist)"; then
              echo "::error title=Missing entitlement::$key was not exported by ldid"
              return 1
            fi
            echo "$key=$value"
            case "$value" in
              true|1) ;;
              *)
                echo "::error title=Invalid entitlement::$key must be true, got $value"
                return 1
                ;;
            esac
          }
          assert_true_entitlement 'platform-application'
          assert_true_entitlement 'com.apple.QuartzCore.displayable-context'
          assert_true_entitlement 'com.apple.QuartzCore.secure-mode'
          assert_true_entitlement 'com.apple.springboard.accessibility-window-hosting'
          assert_true_entitlement 'com.apple.private.hid.client.event-dispatch'
          assert_true_entitlement 'com.apple.private.hid.client.event-filter'
          assert_true_entitlement 'com.apple.private.hid.client.event-monitor'
          assert_true_entitlement 'com.apple.private.hid.client.service-protected'
          assert_true_entitlement 'com.apple.private.hid.manager.client'
          assert_true_entitlement 'user-preference-read'
          assert_true_entitlement 'user-preference-write'
          assert_true_entitlement 'com.apple.private.persona-mgmt'
          assert_true_entitlement 'com.apple.private.security.no-sandbox'
          assert_true_entitlement 'com.apple.private.allow-background-haptics'
          signed_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' artifact/KSBall.entitlements.plist)"
          if [[ "$signed_app_identifier" != 'com.kleinersource.ksball' ]]; then
            echo "::error title=Invalid application identifier::Expected com.kleinersource.ksball, got $signed_app_identifier"
            exit 1
          fi
          artifact_name="KSBall_${VERSION}"
          cp -R "$app_path" artifact/Payload/KSBall.app
          ditto -c -k --sequesterRsrc --keepParent artifact/Payload "artifact/${artifact_name}.tipa"
          (cd artifact && shasum -a 256 "${artifact_name}.tipa" | tee "${artifact_name}.tipa.sha256")
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload TIPA and build log
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            artifact/${{ steps.package.outputs.artifact_name }}.tipa
            artifact/${{ steps.package.outputs.artifact_name }}.tipa.sha256
            artifact/KSBall.entitlements.plist
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish rolling release
    needs: build
    # main 发布标准版 latest，dev 发布开发版 dev；其它分支与拉取请求只产出 Actions 工件。
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 应用内的更新检测读取这个滚动 Release，改名时要同步修改 KSBallUpdateChecker.m。
      RELEASE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # 生成说明时要找到上一次发布以来的全部提交。
          fetch-depth: 0

      - name: Download TIPA
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      # 构建成功后才写回版本号，失败或被取消的构建不会占用版本号。
      # 提交带 [skip ci]，而且 GITHUB_TOKEN 的推送本身也不会触发新的运行。
      - name: Persist build version
        run: |
          set -euo pipefail
          python3 Scripts/bump_version.py --set "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KSBall/Info.plist
          git commit -m "chore: bump build metadata to ${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find release -type f -print
          tipa_path="$(find release -type f -name '*.tipa' -print -quit)"
          checksum_path="$(find release -type f -name '*.tipa.sha256' -print -quit)"
          build_log_path="$(find release -type f -name 'xcodebuild.log' -print -quit)"
          test -n "$tipa_path"
          test -n "$checksum_path"
          test -n "$build_log_path"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          # 必须在删除旧 Release 之前生成：说明以旧 Release 指向的提交为起点。
          bash Scripts/generate_release_notes.sh "$RELEASE_TAG" "$VERSION" "$notes_file"
          cat "$notes_file"
          # 删除后重建，tag 才会移到本次提交；gh release edit --target 不会移动已存在的 tag。
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            "$tipa_path" \
            "$checksum_path" \
            "$build_log_path" \
            --title "KSBall ${VERSION}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --notes-file "$notes_file"
