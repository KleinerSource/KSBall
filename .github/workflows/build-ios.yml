name: Build KSBall

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build Release app
        env:
          DERIVED_DATA: ${{ runner.temp }}/KSBallDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project KSBall.xcodeproj \
            -scheme KSBall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/KSBallDerivedData
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA/Build/Products/Release-iphoneos/KSBall.app"
          test -d "$app_path"
          mkdir -p artifact/Payload
          cp -R "$app_path" artifact/Payload/KSBall.app
          ditto -c -k --sequesterRsrc --keepParent artifact/Payload artifact/KSBall-unsigned.tipa
          shasum -a 256 artifact/KSBall-unsigned.tipa | tee artifact/KSBall-unsigned.tipa.sha256

      - name: Upload unsigned IPA and build log
        uses: actions/upload-artifact@v7
        with:
          name: KSBall-unsigned-${{ github.sha }}
          path: |
            artifact/KSBall-unsigned.tipa
            artifact/KSBall-unsigned.tipa.sha256
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Update testing release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v8
        with:
          name: KSBall-unsigned-${{ github.sha }}
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: testing
        run: |
          set -euo pipefail
          find release -type f -print
          tipa_path="$(find release -type f -name 'KSBall-unsigned.tipa' -print -quit)"
          checksum_path="$(find release -type f -name 'KSBall-unsigned.tipa.sha256' -print -quit)"
          build_log_path="$(find release -type f -name 'xcodebuild.log' -print -quit)"
          test -n "$tipa_path"
          test -n "$checksum_path"
          test -n "$build_log_path"
          release_notes="自动测试构建

          提交：${GITHUB_SHA}
          分支：${GITHUB_REF_NAME}
          工作流：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title 'KSBall 测试构建' \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$release_notes"
            gh release upload "$RELEASE_TAG" \
              "$tipa_path" \
              "$checksum_path" \
              "$build_log_path" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$tipa_path" \
              "$checksum_path" \
              "$build_log_path" \
              --title 'KSBall 测试构建' \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$release_notes"
          fi
